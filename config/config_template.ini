[DEFAULT]
REMINDER_HOUR = 13
STALE_DATA_DAYS = 7
SQLITE_DB_PATH = data/sal_resources.db

; Telegram connects directly to this public IPv4 address over HTTPS.
WEBHOOK_URL = https://<public IPv4>:8443/telegram/

; Administrative Google Sheets report
GAME_DATA_GTABLE_KEY = <report spreadsheet id>
USER_DATA_PAGE_NAME = User data
GSERVICE_FILE = gapi_service_file.json

; Logs
LOG_FORMAT = %%(asctime)s %%(levelname)s %%(name)s %%(module)s:%%(lineno)d | %%(message)s
LOG_DATE_FORMAT = %%d/%%m %%H:%%M:%%S

[Release]
TOKEN = <telegram token>

[Test]
TOKEN = <telegram token>

[Debug]
TOKEN = <telegram token>
