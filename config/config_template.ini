[DEFAULT]
; Google Sheets
ADMINS_PAGE_NAME = Admins
RESOURCES_PAGE_NAME = Resources

; Google Drive
GSERVICE_EMAIL = <service_account_name@project_name.iam.gserviceaccount.com>

; Logs
LOG_FORMAT = %%(asctime)s: %%(levelname)s: %%(pathname)s::%%(funcName)s::%%(lineno)d: %%(message)s
LOG_DATE_FORMAT = %%d/%%m %%H:%%M:%%S

[Release]
TOKEN = <telegram token>
ADMINS_GTABLE_KEY = <admins spreadsheet id>
RESOURCES_GTABLE_KEY = <resources spreadsheet id>
GDRIVE_FOLDER_PATH = <google drive folder id>
LOG_FILE_NAME = SalResourcesManager.log

[Test]
TOKEN = <telegram token>
ADMINS_GTABLE_KEY = <admins spreadsheet id>
RESOURCES_GTABLE_KEY = <resources spreadsheet id>
GDRIVE_FOLDER_PATH = <google drive folder id>
LOG_FILE_NAME = SalResourcesManager.test.log

[Debug]
TOKEN = <telegram token>
ADMINS_GTABLE_KEY = <admins spreadsheet id>
RESOURCES_GTABLE_KEY = <resources spreadsheet id>
GDRIVE_FOLDER_PATH = <google drive folder id>
LOG_FILE_NAME = SalResourcesManager.debug.log
