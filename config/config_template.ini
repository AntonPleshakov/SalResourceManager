[DEFAULT]
; The DNS name must resolve to the server. Caddy serves both the Telegram
; webhook at this path and Grafana at the root of the same HTTPS domain.
WEBHOOK_URL = https://<public DNS name>:8443/telegram/
; Public Google OAuth branding pages served by Caddy on the same server.
OAUTH_BRANDING_URL = https://<OAuth branding DNS name>:8443/

; Private folder owned by the Google account authorized for report export.
; A separate administrative report is created here for each clan.
GAME_DATA_GFOLDER_KEY = <report folder id>

[security]
; Used by Grafana when it creates the initial administrator account.
admin_user = admin
admin_password = <grafana password>

[Release]
TOKEN = <telegram token>

[Test]
TOKEN = <telegram token>

[Debug]
TOKEN = <telegram token>
