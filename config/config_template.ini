[DEFAULT]
; Telegram connects directly to this public IPv4 address over HTTPS.
WEBHOOK_URL = https://<public IPv4>:8443/telegram/

; Private folder owned by the Google account authorized for report export.
; A separate administrative report is created here for each clan.
GAME_DATA_GFOLDER_KEY = <report folder id>

[security]
; Used by Grafana when it creates the initial administrator account.
admin_user = admin
admin_password = <grafana password>

[Release]
TOKEN = <telegram token>

[Test]
TOKEN = <telegram token>

[Debug]
TOKEN = <telegram token>
