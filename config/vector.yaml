data_dir: /tmp/vector

sources:
  docker:
    type: docker_logs
    exclude_containers:
      - sal-resource-manager-vector

sinks:
  victorialogs:
    type: elasticsearch
    inputs:
      - docker
    endpoints:
      - http://victorialogs:9428/insert/elasticsearch/
    api_version: v8
    compression: gzip
    mode: bulk
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: container_name,stream
    buffer:
      type: memory
      max_events: 500
      when_full: drop_newest
