name: sal-resource-manager

services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/antonpleshakov/salresourcemanager:latest}
    container_name: sal-resource-manager
    restart: unless-stopped
    init: true

    environment:
      MODE: ${MODE:-Release}

    ports:
      - "8443:8443"

    expose:
      - "9100"

    volumes:
      - ${CONFIG_FILE:-./config/config.ini}:/app/config/config.ini:ro
      - ${GOOGLE_CREDENTIALS_FILE:-./gapi_service_file.json}:/app/gapi_service_file.json:ro
      - ./certs:/app/certs:ro
      - ./data:/app/data

    mem_limit: 256m
    cpus: 0.50

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: sal-resource-manager-prometheus
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    mem_limit: 256m
    cpus: 0.50

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus-data:
