name: sal-resource-manager

services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/antonpleshakov/salresourcemanager:latest}
    container_name: sal-resource-manager
    restart: unless-stopped
    init: true

    environment:
      MODE: ${MODE:-Release}

    ports:
      - "8443:8443"

    expose:
      - "9100"

    volumes:
      - ${CONFIG_FILE:-./config/config.ini}:/app/config/config.ini:ro
      - ${GOOGLE_CREDENTIALS_FILE:-./gapi_service_file.json}:/app/gapi_service_file.json:ro
      - ./certs:/app/certs:ro
      - ./data:/app/data

    mem_limit: 256m
    cpus: 0.50

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: sal-resource-manager-prometheus
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    mem_limit: 256m
    cpus: 0.50

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.1.1
    container_name: sal-resource-manager-grafana
    restart: unless-stopped

    depends_on:
      - prometheus

    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/sal-resource-manager.json

    ports:
      - "3000:3000"

    volumes:
      - ./config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./config/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/sal-resource-manager.yml:ro
      - ./config/grafana/sal-resource-manager.json:/etc/grafana/dashboards/sal-resource-manager.json:ro
      - ./config/grafana/sal-resource-manager-system.json:/etc/grafana/dashboards/sal-resource-manager-system.json:ro
      - grafana-data:/var/lib/grafana

    mem_limit: 256m
    cpus: 0.50

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  grafana-data:
  prometheus-data:
