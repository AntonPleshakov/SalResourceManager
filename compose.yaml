name: sal-resource-manager

services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/antonpleshakov/salresourcemanager:latest}
    container_name: sal-resource-manager
    restart: unless-stopped
    init: true

    environment:
      MODE: ${MODE:-Release}

    expose:
      - "8443"
      - "9100"

    volumes:
      - ${CONFIG_FILE:-./config/config.ini}:/app/config/config.ini:ro
      - ${GOOGLE_OAUTH_TOKEN_FILE:-./config/google_oauth_token.json}:/app/config/google_oauth_token.json:ro
      - ./data:/app/data

    mem_limit: 256m
    cpus: 0.50

    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.11.1
    container_name: sal-resource-manager-node-exporter
    restart: unless-stopped
    pid: host
    read_only: true

    command:
      - --path.rootfs=/host
      - --no-collector.timex

    expose:
      - "9100"

    volumes:
      - /:/host:ro,rslave

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 64m
    cpus: 0.10

    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: sal-resource-manager-prometheus
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    mem_limit: 256m
    cpus: 0.50

    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

  grafana:
    image: grafana/grafana:13.1.1
    container_name: sal-resource-manager-grafana
    restart: unless-stopped

    depends_on:
      - prometheus

    environment:
      GOMEMLIMIT: 200MiB
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_METRICS_ENABLED: "true"
      GF_PLUGINS_PREINSTALL: victoriametrics-logs-datasource@0.32.0
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/sal-resource-manager.json

    expose:
      - "3000"

    volumes:
      - ./config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./config/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/sal-resource-manager.yml:ro
      - ./config/grafana/sal-resource-manager.json:/etc/grafana/dashboards/sal-resource-manager.json:ro
      - ./config/grafana/sal-resource-manager-system.json:/etc/grafana/dashboards/sal-resource-manager-system.json:ro
      - grafana-data:/var/lib/grafana

    mem_limit: 256m
    cpus: 0.50

    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

  caddy:
    image: caddy:2.11.4-alpine
    container_name: sal-resource-manager-caddy
    restart: unless-stopped

    depends_on:
      - bot
      - grafana

    environment:
      CADDY_PUBLIC_HOST: ${CADDY_PUBLIC_HOST:?CADDY_PUBLIC_HOST is required}
      CADDY_WEBHOOK_PATH: ${CADDY_WEBHOOK_PATH:?CADDY_WEBHOOK_PATH is required}

    ports:
      - "80:80"
      - "8443:8443"
      - "8443:8443/udp"

    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

    mem_limit: 96m
    cpus: 0.25

    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

  victorialogs:
    image: docker.io/victoriametrics/victoria-logs:v1.52.0
    container_name: sal-resource-manager-victorialogs
    restart: unless-stopped

    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=7d
      - -retention.maxDiskSpaceUsageBytes=1GiB

    volumes:
      - victorialogs-data:/victoria-logs-data

    expose:
      - "9428"

    mem_limit: 192m
    cpus: 0.25

    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

  vector:
    image: timberio/vector:0.55.0-alpine
    container_name: sal-resource-manager-vector
    restart: unless-stopped

    depends_on:
      - victorialogs

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/vector.yaml:/etc/vector/vector.yaml:ro

    mem_limit: 128m
    cpus: 0.25

    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  caddy-config:
  caddy-data:
  grafana-data:
  prometheus-data:
  victorialogs-data:
