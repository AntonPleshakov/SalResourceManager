services:
  bot:
    build:
      context: .
    image: sal-resources-manager:latest
    container_name: sal-resources-manager
    restart: unless-stopped
    init: true
    mem_limit: 256m
    cpus: 0.50
    environment:
      MODE: Release
      LOG_TO_GDRIVE: "false"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./config/config.ini:/app/config/config.ini:ro
      - ./gapi_service_file.json:/app/gapi_service_file.json:ro
